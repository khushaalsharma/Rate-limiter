server.port=8080

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{correlationId}] %logger{36} - %msg%n
management.endpoints.web.exposure.include=beans,conditions,env,health

spring.autoconfigure.exclude=

spring.datasource.url=jdbc:mysql://localhost:3306/ratelimiter-testDB?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

spring.data.redis.host=localhost
spring.data.redis.port=6379

ratelimiter.strategy=DOMAIN
ratelimiter.algorithm=SLIDING_WINDOW
ratelimiter.redis.key-prefix=rl
ratelimiter.analytics.enabled=true
ratelimiter.analytics.topic=rate-limit-events

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=ratelimiter-analytics
spring.kafka.consumer.properties.spring.json.trusted.packages=io.github.khushaalsharma.ratelimiter.autoconfigure.analytics
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=io.github.khushaalsharma.ratelimiter.autoconfigure.analytics.RateLimitEventDto
spring.kafka.consumer.properties.spring.json.use.type.headers=true

