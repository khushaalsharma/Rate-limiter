spring.application.name=app
# =====================
# Server
# =====================
server.port=8080

# =====================
# PostgreSQL
# =====================
spring.datasource.url=jdbc:postgresql://localhost:5432/rate-limiter
spring.datasource.username=postgres
spring.datasource.password=|0799Vd2
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# =====================
# Redis
# =====================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=10
spring.data.redis.lettuce.pool.max-idle=5
spring.data.redis.lettuce.pool.min-idle=2

# =====================
# Kafka
# =====================
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=1
spring.kafka.producer.retries=3

spring.kafka.consumer.group-id=analytics-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.rate_limiter.dto

# =====================
# Actuator
# =====================
management.endpoints.web.exposure.include=health,info,metrics

# =====================
# Logging
# =====================
logging.level.com.rate_limiter=DEBUG
logging.level.org.springframework.data.redis=INFO